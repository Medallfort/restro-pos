services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # Ma kat-exposach l-barra: ghir backend li kayweslha

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8000
      MONGODB_URI: mongodb://mongo:27017/restro
      TRUST_PROXY: 1

  web:
    build: .
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mongo-data:
